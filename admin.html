<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0b0b">
  <title>Panel | Barbería Augusto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --acento: #c9a24b;
      --fondo: #0b0b0b;
      --tarjeta: #151515;
      --borde: #2b2b2b;
      --texto: #f4efe6;
      --suave: #9b968c;
      --rojo: #8f2a2a;
      --verde: #25d366;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; font-family: 'Inter', Arial, sans-serif; background: var(--fondo); color: var(--texto); line-height: 1.5; padding: 20px 16px 90px; }
    .wrap { max-width: 560px; margin: 0 auto; }
    h1, h2 { font-family: 'Oswald', Impact, sans-serif; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; margin: 0; }
    h1 { font-size: 26px; }
    h2 { font-size: 20px; margin-bottom: 14px; }
    .etiqueta { letter-spacing: 4px; font-size: 11px; text-transform: uppercase; color: var(--acento); font-weight: 600; }
    .cabecera { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }

    .tarjeta { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 16px; padding: 18px; margin-bottom: 18px; }
    input, select { width: 100%; padding: 13px; border-radius: 10px; border: 1px solid var(--borde); background: #1f1f1f; color: var(--texto); font: 16px 'Inter', Arial, sans-serif; }
    input:focus, select:focus { outline: none; border-color: var(--acento); }
    label { display: block; font-size: 13px; color: var(--suave); margin: 12px 0 5px; }
    label:first-child { margin-top: 0; }

    button { font: 600 15px 'Inter', Arial, sans-serif; cursor: pointer; border-radius: 10px; border: 1px solid var(--borde); background: #1f1f1f; color: var(--texto); padding: 12px 16px; }
    button:hover { border-color: var(--acento); }
    .principal { width: 100%; background: var(--acento); color: #111; border: none; margin-top: 16px; padding: 14px; }
    .peligro { background: var(--rojo); border: none; color: #fff; }
    .chico { padding: 8px 12px; font-size: 13px; }

    /* Resumen semanal */
    .semana { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
    .dia { flex-shrink: 0; min-width: 64px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 8px; }
    .dia .nom { font-size: 12px; color: var(--suave); }
    .dia .fec { font-weight: 600; }
    .dia .cant { font-size: 12px; color: var(--suave); }
    .dia.tiene .cant { color: var(--acento); font-weight: 600; }
    .dia.activo { border-color: var(--acento); background: rgba(201,162,75,.15); }

    /* Navegación de fecha */
    .nav-fecha { display: flex; gap: 8px; margin-bottom: 14px; }
    .nav-fecha input { flex: 1; min-width: 0; }
    .nav-fecha button { padding: 12px 14px; }
    .titulo-dia { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; gap: 8px; }
    .titulo-dia .fecha-larga { font-weight: 600; text-transform: capitalize; }
    .titulo-dia .total { color: var(--acento); font-size: 14px; font-weight: 600; white-space: nowrap; }

    /* Lista de turnos */
    .turno { background: #1b1b1b; border: 1px solid var(--borde); border-left: 4px solid var(--acento); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .turno.bloqueo { border-left-color: #777; background: #202018; border-style: dashed; border-left-style: solid; }
    .turno.manual { border-left-color: var(--verde); }
    .turno .hora { font-family: 'Oswald', Impact, sans-serif; font-size: 20px; letter-spacing: 1px; }
    .turno .detalle { color: var(--suave); font-size: 14px; word-break: break-word; }
    .vacio { color: var(--suave); text-align: center; padding: 22px 10px; }

    .fila2 { display: flex; gap: 10px; }
    .fila2 > div { flex: 1; min-width: 0; }

    /* Avisos */
    .toast { position: fixed; left: 16px; right: 16px; bottom: 18px; max-width: 520px; margin: 0 auto; padding: 14px 16px; border-radius: 12px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 20; }
    .toast.visible { opacity: 1; }
    .toast.ok { background: #12301f; border: 1px solid #1f5c3a; }
    .toast.error { background: #3a1616; border: 1px solid #6b2525; }
    #msgLogin { margin-top: 14px; padding: 12px; border-radius: 10px; display: none; background: #3a1616; border: 1px solid #6b2525; }
    #msgLogin.visible { display: block; }
    .pie { text-align: center; color: var(--suave); font-size: 12px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="wrap">

    <div class="cabecera">
      <div>
        <div class="etiqueta">Panel</div>
        <h1>Barbería Augusto</h1>
      </div>
      <button id="salir" class="chico" hidden>Salir</button>
    </div>

    <!-- LOGIN -->
    <div id="login" class="tarjeta">
      <h2>Iniciar sesión</h2>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" placeholder="tu@email.com">
      <label for="clave">Contraseña</label>
      <input id="clave" type="password" autocomplete="current-password" placeholder="Contraseña">
      <button id="entrar" class="principal">Entrar</button>
      <div id="msgLogin"></div>
    </div>

    <!-- PANEL -->
    <div id="panel" hidden>

      <div class="tarjeta">
        <h2>Próximos 7 días</h2>
        <div id="semana" class="semana"></div>
      </div>

      <div class="tarjeta">
        <div class="nav-fecha">
          <button id="ant" aria-label="Día anterior">◀</button>
          <input id="fecha" type="date">
          <button id="sig" aria-label="Día siguiente">▶</button>
        </div>
        <div class="nav-fecha">
          <button id="hoy" style="flex:1">Hoy</button>
          <button id="actualizar" style="flex:1">Actualizar</button>
        </div>

        <div class="titulo-dia">
          <span id="fechaLarga" class="fecha-larga"></span>
          <span id="total" class="total"></span>
        </div>
        <div id="lista"></div>
      </div>

      <div class="tarjeta">
        <h2>Agregar turno manual</h2>
        <label for="mNombre">Nombre del cliente</label>
        <input id="mNombre" type="text" placeholder="Ej: Juan Pérez">
        <label for="mServicio">Servicio</label>
        <select id="mServicio"></select>
        <label for="mHora">Hora de inicio</label>
        <input id="mHora" type="time" step="1800" value="10:00">
        <button id="agregar" class="principal">Agregar a la agenda</button>
        <p class="pie">Se agrega en la fecha que tengas seleccionada arriba.</p>
      </div>

      <div class="tarjeta">
        <h2>Bloquear horario</h2>
        <div class="fila2">
          <div>
            <label for="horaBloqueo">Desde</label>
            <input id="horaBloqueo" type="time" step="1800" value="10:00">
          </div>
          <div>
            <label for="duracion">Duración</label>
            <select id="duracion">
              <option value="30">30 min</option>
              <option value="60" selected>1 hora</option>
              <option value="90">1 h 30</option>
              <option value="120">2 horas</option>
              <option value="180">3 horas</option>
              <option value="240">4 horas</option>
            </select>
          </div>
        </div>
        <button id="bloquear" class="principal">Bloquear ese horario</button>
        <button id="bloquearDia" class="peligro" style="width:100%; margin-top:10px">Bloquear el día completo</button>
        <p class="pie">Se bloquea en la fecha que tengas seleccionada arriba.</p>
      </div>

    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    // ===== CONFIGURACIÓN =====
    const SUPABASE_URL = "https://buvcgwjmmgzvhrnebleb.supabase.co";
    const SUPABASE_KEY = "sb_publishable_LVw0YJW6ujE4ST69gSrpwQ_C9do6GOT";

    // Tienen que ser los mismos servicios que en index.html
    const SERVICIOS = [
      { nombre: "Corte", minutos: 30 },
      { nombre: "Corte + barba", minutos: 45 },
      { nombre: "Perfilado de Barba", minutos: 30 }
    ];
    // ===== FIN DE LA CONFIGURACIÓN =====

    const $ = id => document.getElementById(id);
    const pad = n => String(n).padStart(2, "0");
    const fechaISO = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
    const aMin = h => { const p = h.split(":"); return Number(p[0]) * 60 + Number(p[1]); };
    const aTexto = m => pad(Math.floor(m / 60)) + ":" + pad(m % 60);
    const aFecha = iso => { const p = iso.split("-"); return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])); };
    const nombresCortos = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];

    let token = sessionStorage.getItem("token");
    let refresco = sessionStorage.getItem("refresco");
    let cargando = false;

    // ---------- Avisos ----------
    function aviso(tipo, texto) {
      const el = $("toast");
      el.className = "toast " + tipo + " visible";
      el.textContent = texto;
      clearTimeout(aviso.t);
      aviso.t = setTimeout(function () { el.className = "toast"; }, 4000);
    }

    function avisoLogin(texto) {
      const el = $("msgLogin");
      el.textContent = texto;
      el.className = texto ? "visible" : "";
    }

    // ---------- Conexión con la base de datos ----------
    function guardarSesion(datos) {
      token = datos.access_token;
      refresco = datos.refresh_token || refresco;
      sessionStorage.setItem("token", token);
      if (refresco) sessionStorage.setItem("refresco", refresco);
    }

    async function renovar() {
      if (!refresco) return false;
      try {
        const r = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=refresh_token", {
          method: "POST",
          headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
          body: JSON.stringify({ refresh_token: refresco })
        });
        if (!r.ok) return false;
        const datos = await r.json();
        if (!datos.access_token) return false;
        guardarSesion(datos);
        return true;
      } catch (e) {
        return false;
      }
    }

    async function api(ruta, opciones) {
      opciones = opciones || {};
      async function pedir() {
        return fetch(SUPABASE_URL + ruta, {
          method: opciones.method || "GET",
          headers: Object.assign({
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + token,
            "Content-Type": "application/json"
          }, opciones.headers || {}),
          body: opciones.body
        });
      }
      let r = await pedir();
      if (r.status === 401 && await renovar()) r = await pedir();
      if (r.status === 401) { salir("Tu sesión venció. Entrá de nuevo."); }
      return r;
    }

    // ---------- Login ----------
    async function entrar() {
      const email = $("email").value.trim();
      const clave = $("clave").value;
      if (!email || !clave) { avisoLogin("Completá el email y la contraseña."); return; }
      $("entrar").textContent = "Entrando...";
      try {
        const r = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", {
          method: "POST",
          headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
          body: JSON.stringify({ email: email, password: clave })
        });
        const datos = await r.json();
        if (!r.ok || !datos.access_token) { avisoLogin("Email o contraseña incorrectos."); }
        else { guardarSesion(datos); avisoLogin(""); $("clave").value = ""; mostrarPanel(); }
      } catch (e) {
        avisoLogin("No hay conexión. Probá de nuevo.");
      }
      $("entrar").textContent = "Entrar";
    }

    function salir(mensaje) {
      token = null; refresco = null;
      sessionStorage.removeItem("token");
      sessionStorage.removeItem("refresco");
      $("panel").hidden = true;
      $("salir").hidden = true;
      $("login").hidden = false;
      avisoLogin(mensaje || "");
    }

    function mostrarPanel() {
      $("login").hidden = true;
      $("panel").hidden = false;
      $("salir").hidden = false;
      if (!$("fecha").value) $("fecha").value = fechaISO(new Date());
      cargar();
    }

    // ---------- Cargar datos ----------
    async function cargar() {
      if (cargando || !token) return;
      cargando = true;
      const fecha = $("fecha").value;
      if (!fecha) { cargando = false; return; }

      $("fechaLarga").textContent = aFecha(fecha).toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long" });

      try {
        const r = await api("/rest/v1/turnos?fecha=eq." + fecha + "&estado=eq.activo&order=hora.asc&select=id,hora,servicio,minutos,nombre");
        if (!r.ok) throw new Error("Error " + r.status);
        dibujarLista(await r.json());
      } catch (e) {
        $("lista").innerHTML = '<div class="vacio">No se pudieron cargar los turnos. Tocá "Actualizar".</div>';
        $("total").textContent = "";
      }
      await cargarSemana();
      cargando = false;
    }

    async function cargarSemana() {
      const hoy = new Date();
      const fin = new Date();
      fin.setDate(fin.getDate() + 6);
      try {
        const r = await api("/rest/v1/turnos?fecha=gte." + fechaISO(hoy) + "&fecha=lte." + fechaISO(fin) + "&estado=eq.activo&servicio=neq.BLOQUEO&select=fecha");
        if (!r.ok) throw new Error();
        const filas = await r.json();
        const cuentas = {};
        filas.forEach(function (f) { cuentas[f.fecha] = (cuentas[f.fecha] || 0) + 1; });
        dibujarSemana(cuentas);
      } catch (e) {
        dibujarSemana({});
      }
    }

    // ---------- Dibujar ----------
    function dibujarSemana(cuentas) {
      const cont = $("semana");
      cont.innerHTML = "";
      for (let i = 0; i < 7; i++) {
        const d = new Date();
        d.setDate(d.getDate() + i);
        const iso = fechaISO(d);
        const n = cuentas[iso] || 0;

        const b = document.createElement("button");
        b.type = "button";
        b.className = "dia" + (n > 0 ? " tiene" : "") + (iso === $("fecha").value ? " activo" : "");
        const a = document.createElement("span"); a.className = "nom"; a.textContent = i === 0 ? "Hoy" : nombresCortos[d.getDay()];
        const f = document.createElement("span"); f.className = "fec"; f.textContent = d.getDate() + "/" + (d.getMonth() + 1);
        const c = document.createElement("span"); c.className = "cant"; c.textContent = n === 1 ? "1 turno" : n + " turnos";
        b.appendChild(a); b.appendChild(f); b.appendChild(c);
        b.onclick = function () { $("fecha").value = iso; cargar(); };
        cont.appendChild(b);
      }
    }

    function dibujarLista(turnos) {
      const lista = $("lista");
      lista.innerHTML = "";

      const reales = turnos.filter(function (t) { return t.servicio !== "BLOQUEO"; });
      $("total").textContent = reales.length === 1 ? "1 turno" : reales.length + " turnos";

      if (turnos.length === 0) {
        lista.innerHTML = '<div class="vacio">No hay turnos ni bloqueos para este día.</div>';
        return;
      }

      turnos.forEach(function (t) {
        const inicio = aMin(t.hora.slice(0, 5));
        const esBloqueo = t.servicio === "BLOQUEO";
        const esManual = t.nombre.indexOf("★") === 0;

        const caja = document.createElement("div");
        caja.className = "turno" + (esBloqueo ? " bloqueo" : "") + (esManual ? " manual" : "");

        const info = document.createElement("div");
        const hora = document.createElement("div");
        hora.className = "hora";
        hora.textContent = (esBloqueo && t.minutos >= 1439) ? "Todo el día" : aTexto(inicio) + " a " + aTexto(inicio + t.minutos);
        const detalle = document.createElement("div");
        detalle.className = "detalle";
        detalle.textContent = esBloqueo ? "Horario bloqueado" : t.nombre.replace("★ ", "") + " · " + t.servicio + (esManual ? " (cargado a mano)" : "");
        info.appendChild(hora);
        info.appendChild(detalle);

        const boton = document.createElement("button");
        boton.className = "peligro chico";
        boton.textContent = esBloqueo ? "Quitar" : "Cancelar";
        boton.onclick = function () { cancelar(t, esBloqueo); };

        caja.appendChild(info);
        caja.appendChild(boton);
        lista.appendChild(caja);
      });
    }

    // ---------- Acciones ----------
    async function cancelar(t, esBloqueo) {
      const pregunta = esBloqueo ? "¿Quitar este bloqueo?" : "¿Cancelar el turno de " + t.nombre.replace("★ ", "") + "?";
      if (!confirm(pregunta)) return;
      try {
        const r = await api("/rest/v1/turnos?id=eq." + t.id, {
          method: "PATCH",
          headers: { "Prefer": "return=minimal" },
          body: JSON.stringify({ estado: "cancelado" })
        });
        if (!r.ok) throw new Error();
        aviso("ok", esBloqueo ? "Bloqueo quitado." : "Turno cancelado. Avisale al cliente por WhatsApp.");
        cargar();
      } catch (e) {
        aviso("error", "No se pudo completar. Probá de nuevo.");
      }
    }

    async function crear(datos, textoOk) {
      try {
        const r = await api("/rest/v1/turnos", {
          method: "POST",
          headers: { "Prefer": "return=minimal" },
          body: JSON.stringify(datos)
        });
        if (r.status === 409) { aviso("error", "Ese horario ya está ocupado o bloqueado. Revisá la lista."); return false; }
        if (!r.ok) throw new Error();
        aviso("ok", textoOk);
        cargar();
        return true;
      } catch (e) {
        aviso("error", "No se pudo guardar. Probá de nuevo.");
        return false;
      }
    }

    async function agregarManual() {
      const nombre = $("mNombre").value.trim();
      const hora = $("mHora").value;
      const servicio = SERVICIOS[Number($("mServicio").value)];
      if (!nombre) { aviso("error", "Escribí el nombre del cliente."); return; }
      if (!hora) { aviso("error", "Elegí la hora."); return; }
      const ok = await crear({
        fecha: $("fecha").value,
        hora: hora,
        servicio: servicio.nombre,
        minutos: servicio.minutos,
        nombre: "★ " + nombre
      }, "Turno agregado a la agenda.");
      if (ok) $("mNombre").value = "";
    }

    function bloquearHorario() {
      const hora = $("horaBloqueo").value;
      if (!hora) { aviso("error", "Elegí la hora de inicio."); return; }
      crear({
        fecha: $("fecha").value,
        hora: hora,
        servicio: "BLOQUEO",
        minutos: Number($("duracion").value),
        nombre: "Bloqueado"
      }, "Horario bloqueado.");
    }

    function bloquearDia() {
      if (!confirm("¿Bloquear todo el día " + $("fecha").value + "?")) return;
      crear({
        fecha: $("fecha").value,
        hora: "00:00",
        servicio: "BLOQUEO",
        minutos: 1439,
        nombre: "Bloqueado"
      }, "Día completo bloqueado.");
    }

    function moverDia(delta) {
      const d = aFecha($("fecha").value);
      d.setDate(d.getDate() + delta);
      $("fecha").value = fechaISO(d);
      cargar();
    }

    // ---------- Eventos ----------
    SERVICIOS.forEach(function (s, i) {
      const o = document.createElement("option");
      o.value = i;
      o.textContent = s.nombre + " (" + s.minutos + " min)";
      $("mServicio").appendChild(o);
    });

    $("entrar").onclick = entrar;
    $("clave").addEventListener("keydown", function (e) { if (e.key === "Enter") entrar(); });
    $("salir").onclick = function () { salir(); };
    $("fecha").onchange = cargar;
    $("ant").onclick = function () { moverDia(-1); };
    $("sig").onclick = function () { moverDia(1); };
    $("hoy").onclick = function () { $("fecha").value = fechaISO(new Date()); cargar(); };
    $("actualizar").onclick = function () { cargar(); aviso("ok", "Agenda actualizada."); };
    $("agregar").onclick = agregarManual;
    $("bloquear").onclick = bloquearHorario;
    $("bloquearDia").onclick = bloquearDia;

    // Se actualiza sola cada minuto mientras la pestaña está visible
    setInterval(function () { if (token && !document.hidden) cargar(); }, 60000);

    if (token) mostrarPanel();
  </script>
</body>
</html>
